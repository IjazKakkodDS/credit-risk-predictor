<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" width="100%" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Artifact and Provenance Flow</title>
  <desc id="svgDesc">The training command produces the model and preprocessor, metrics and plots, split and segment reports, and the environment and source fingerprint. The model, metrics, and split artifacts are combined into SHA-256 checksums, while the environment and source fingerprint feeds the provenance report alongside the checksums.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .lbl { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .zoneLabel { font-size:10px; font-weight:700; letter-spacing:1.4px; }
    .nodeTitle { font-size:13px; font-weight:600; text-anchor:middle; }
    .nodeSub { font-size:10.5px; opacity:0.85; text-anchor:middle; }
    .noteText { font-size:11.5px; fill:#475569; text-anchor:middle; }
  </style>
  <rect x="0" y="0" width="1120" height="530" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1120" height="56" rx="10" fill="#0F172A"/>
  <rect x="0" y="44" width="1120" height="12" fill="#0F172A"/>
  <text class="lbl" x="560" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#F1F5F9">Artifact and Provenance Flow</text>

  <!-- zones -->
  <rect x="15" y="76" width="535" height="376" rx="6" fill="#EFF6FF"/>
  <text class="lbl zoneLabel" x="30" y="95" fill="#1D4ED8">TRAINING OUTPUTS</text>
  <rect x="560" y="166" width="545" height="196" rx="6" fill="#F0FDF4"/>
  <text class="lbl zoneLabel" x="575" y="185" fill="#15803D">INTEGRITY &amp; PROVENANCE</text>

  <!-- arrows -->
  <path d="M275,272 Q290,200 305,137" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M275,272 Q290,250 305,227" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M275,272 Q290,295 305,317" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M275,272 Q290,340 305,407" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M545,137 Q560,180 575,227" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <line x1="545" y1="227" x2="573" y2="227" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M545,317 Q560,274 575,227" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M815,227 Q830,270 845,317" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M545,407 Q700,407 845,317" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#ah)"/>

  <!-- node A -->
  <rect x="35" y="241" width="240" height="62" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="155" y="267" fill="#1E3A8A">Training command</text>
  <text class="lbl nodeSub" x="155" y="283" fill="#1E3A8A">scripts/train_credit_risk_model.py</text>

  <!-- column 2 -->
  <rect x="305" y="106" width="240" height="62" rx="8" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="425" y="132" fill="#064E3B">Model and preprocessor</text>
  <text class="lbl nodeSub" x="425" y="148" fill="#064E3B">artifact/*.pkl</text>

  <rect x="305" y="196" width="240" height="62" rx="8" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="425" y="222" fill="#064E3B">Metrics and plots</text>
  <text class="lbl nodeSub" x="425" y="238" fill="#064E3B">ROC · PR · calibration · confusion</text>

  <rect x="305" y="286" width="240" height="62" rx="8" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="425" y="312" fill="#064E3B">Split and segment reports</text>
  <text class="lbl nodeSub" x="425" y="328" fill="#064E3B">Temporal + diagnostic groups</text>

  <rect x="305" y="376" width="240" height="62" rx="8" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="425" y="401" fill="#064E3B">Environment and</text>
  <text class="lbl nodeTitle" x="425" y="417" fill="#064E3B">source fingerprint</text>

  <!-- column 3 -->
  <rect x="575" y="196" width="240" height="62" rx="8" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="695" y="222" fill="#064E3B">SHA-256 checksums</text>
  <text class="lbl nodeSub" x="695" y="238" fill="#064E3B">artifact_checksums.json</text>

  <!-- column 4 -->
  <rect x="845" y="286" width="240" height="62" rx="8" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="965" y="312" fill="#064E3B">Provenance report</text>
  <text class="lbl nodeSub" x="965" y="328" fill="#064E3B">provenance.json</text>

  <!-- boundary note -->
  <rect x="15" y="472" width="1090" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text class="lbl noteText" x="560" y="495">Checksummed model, metrics, and environment record</text>
</svg>
