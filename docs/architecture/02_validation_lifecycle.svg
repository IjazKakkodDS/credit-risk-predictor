<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="100%" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Validation Lifecycle</title>
  <desc id="svgDesc">CR-3 validation lifecycle: load the local ignored source, map resolved target outcomes, apply the feature policy, create ordered temporal partitions, fit preprocessing and a balanced model, fit the probability calibrator, select an analytical threshold on the calibration split, evaluate the untouched test split once, and generate plots, metrics, segments, and provenance.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4338ca"/>
    </marker>
  </defs>
  <style>
    .bg { fill:#ffffff; }
    .titleBand { fill:#1e293b; }
    .titleText { font-family: Arial, Helvetica, sans-serif; font-size:19px; font-weight:bold; fill:#ffffff; text-anchor:middle; }
    .subtitleText { font-family: Arial, Helvetica, sans-serif; font-size:11.5px; fill:#cbd5e1; text-anchor:middle; }
    .zone { fill:#f8fafc; stroke:#e2e8f0; stroke-width:1.25; stroke-dasharray:4,3; }
    .zoneLabel { font-family: Arial, Helvetica, sans-serif; font-size:11px; font-weight:bold; fill:#475569; }
    .nodeProcess { fill:#ffffff; stroke:#4338ca; stroke-width:1.75; }
    .nodeProtected { fill:#eef2ff; stroke:#4338ca; stroke-width:1.75; }
    .nodeArtifact { fill:#ffffff; stroke:#64748b; stroke-width:1.5; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:12.5px; fill:#1e293b; text-anchor:middle; }
    .edge { stroke:#4338ca; stroke-width:2; fill:none; marker-end:url(#arrow); }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="580"/>

  <rect class="titleBand" x="0" y="0" width="880" height="70"/>
  <text class="titleText" x="440" y="32">Validation Lifecycle</text>
  <text class="subtitleText" x="440" y="54">Nine-step CR-3 training and evidence generation pipeline</text>

  <!-- zones -->
  <rect class="zone" x="25" y="98" width="830" height="116" rx="8"/>
  <text class="zoneLabel" x="35" y="113">DATA LOADING &amp; FEATURE POLICY</text>
  <rect class="zone" x="25" y="268" width="830" height="116" rx="8"/>
  <text class="zoneLabel" x="35" y="283">PARTITIONING &amp; MODEL FIT</text>
  <rect class="zone" x="25" y="438" width="830" height="116" rx="8"/>
  <text class="zoneLabel" x="35" y="453">THRESHOLD, TEST &amp; EVIDENCE</text>

  <!-- edges -->
  <line class="edge" x1="280" y1="165" x2="318" y2="165"/>
  <line class="edge" x1="560" y1="165" x2="598" y2="165"/>
  <line class="edge" x1="720" y1="200" x2="720" y2="298"/>
  <line class="edge" x1="600" y1="335" x2="562" y2="335"/>
  <line class="edge" x1="320" y1="335" x2="282" y2="335"/>
  <line class="edge" x1="160" y1="370" x2="160" y2="468"/>
  <line class="edge" x1="280" y1="505" x2="318" y2="505"/>
  <line class="edge" x1="560" y1="505" x2="598" y2="505"/>

  <!-- nodes -->
  <rect class="nodeProcess" x="40" y="130" width="240" height="70" rx="10"/>
  <text class="label" x="160" y="154">Load local ignored</text>
  <text class="label" x="160" y="170">source</text>

  <rect class="nodeProcess" x="320" y="130" width="240" height="70" rx="10"/>
  <text class="label" x="440" y="154">Map resolved target</text>
  <text class="label" x="440" y="170">outcomes</text>

  <rect class="nodeProcess" x="600" y="130" width="240" height="70" rx="10"/>
  <text class="label" x="720" y="169">Apply feature policy</text>

  <rect class="nodeProcess" x="600" y="300" width="240" height="70" rx="10"/>
  <text class="label" x="720" y="324">Create ordered</text>
  <text class="label" x="720" y="340">partitions</text>

  <rect class="nodeProcess" x="320" y="300" width="240" height="70" rx="10"/>
  <text class="label" x="440" y="324">Fit preprocessing and</text>
  <text class="label" x="440" y="340">balanced model</text>

  <rect class="nodeProcess" x="40" y="300" width="240" height="70" rx="10"/>
  <text class="label" x="160" y="324">Fit probability</text>
  <text class="label" x="160" y="340">calibrator</text>

  <rect class="nodeProcess" x="40" y="470" width="240" height="70" rx="10"/>
  <text class="label" x="160" y="494">Select analytical</text>
  <text class="label" x="160" y="510">threshold</text>

  <rect class="nodeProtected" x="320" y="470" width="240" height="70" rx="10"/>
  <text class="label" x="440" y="509">Evaluate untouched test</text>

  <rect class="nodeArtifact" x="600" y="470" width="240" height="70" rx="10"/>
  <text class="label" x="720" y="494">Generate plots,</text>
  <text class="label" x="720" y="510">metrics, segments,</text>
  <text class="label" x="720" y="526">and provenance</text>
</svg>
