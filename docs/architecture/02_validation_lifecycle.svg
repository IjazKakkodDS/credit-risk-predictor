<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 512" width="100%" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Validation Lifecycle</title>
  <desc id="svgDesc">CR-3 validation lifecycle: load the local ignored source, map resolved target outcomes, apply the feature policy, create ordered temporal partitions, fit preprocessing and a balanced model, fit the probability calibrator, select an analytical threshold on the calibration split, evaluate the untouched test split once, and generate plots, metrics, segments, and provenance.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .lbl { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .zoneLabel { font-size:10px; font-weight:700; letter-spacing:1.4px; }
    .nodeTitle { font-size:13px; font-weight:600; text-anchor:middle; }
    .nodeSub { font-size:10.5px; opacity:0.85; text-anchor:middle; }
    .noteText { font-size:11.5px; fill:#475569; text-anchor:middle; }
  </style>
  <rect x="0" y="0" width="880" height="512" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="880" height="56" rx="10" fill="#0F172A"/>
  <rect x="0" y="44" width="880" height="12" fill="#0F172A"/>
  <text class="lbl" x="440" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#F1F5F9">Validation Lifecycle</text>

  <!-- zones -->
  <rect x="15" y="76" width="850" height="106" rx="6" fill="#EFF6FF"/>
  <text class="lbl zoneLabel" x="30" y="95" fill="#1D4ED8">DATA LOADING &amp; FEATURE POLICY</text>
  <rect x="15" y="202" width="850" height="106" rx="6" fill="#F5F3FF"/>
  <text class="lbl zoneLabel" x="30" y="221" fill="#6D28D9">PARTITIONING, MODEL FIT &amp; CALIBRATION</text>
  <rect x="15" y="328" width="850" height="106" rx="6" fill="#FFF7ED"/>
  <text class="lbl zoneLabel" x="30" y="347" fill="#B45309">THRESHOLD, TEST &amp; EVIDENCE</text>

  <!-- arrows -->
  <line x1="285" y1="137" x2="313" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="565" y1="137" x2="593" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="715" y1="168" x2="715" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="595" y1="263" x2="567" y2="263" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="315" y1="263" x2="287" y2="263" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="155" y1="294" x2="155" y2="356" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="285" y1="389" x2="313" y2="389" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="565" y1="389" x2="593" y2="389" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- row 1 -->
  <rect x="35" y="106" width="250" height="62" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="160" y="132" fill="#1E3A8A">Load local ignored source</text>
  <text class="lbl nodeSub" x="160" y="148" fill="#1E3A8A">Gitignored CSV, not committed</text>

  <rect x="315" y="106" width="250" height="62" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="440" y="132" fill="#1E3A8A">Map resolved target outcomes</text>
  <text class="lbl nodeSub" x="440" y="148" fill="#1E3A8A">Charged Off/Default vs Fully Paid</text>

  <rect x="595" y="106" width="250" height="62" rx="8" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="720" y="132" fill="#3B0764">Apply feature policy</text>
  <text class="lbl nodeSub" x="720" y="148" fill="#3B0764">27 application-time inputs</text>

  <!-- row 2 -->
  <rect x="595" y="232" width="250" height="62" rx="8" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="720" y="258" fill="#3B0764">Create ordered partitions</text>
  <text class="lbl nodeSub" x="720" y="274" fill="#3B0764">60/20/20 split by issue_d</text>

  <rect x="315" y="232" width="250" height="62" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="440" y="257" fill="#7F1D1D">Fit preprocessing and</text>
  <text class="lbl nodeTitle" x="440" y="273" fill="#7F1D1D">balanced model</text>

  <rect x="35" y="232" width="250" height="62" rx="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="160" y="258" fill="#7C2D12">Fit probability calibrator</text>
  <text class="lbl nodeSub" x="160" y="274" fill="#7C2D12">Platt sigmoid</text>

  <!-- row 3 -->
  <rect x="35" y="358" width="250" height="62" rx="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="160" y="384" fill="#7C2D12">Select analytical threshold</text>
  <text class="lbl nodeSub" x="160" y="400" fill="#7C2D12">Best F1 on calibration split</text>

  <rect x="315" y="358" width="250" height="62" rx="8" fill="#CFFAFE" stroke="#0E7490" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="440" y="384" fill="#164E63">Evaluate untouched test</text>
  <text class="lbl nodeSub" x="440" y="400" fill="#164E63">One-time, ROC-AUC 0.7322</text>

  <rect x="595" y="358" width="250" height="62" rx="8" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="720" y="383" fill="#064E3B">Generate plots, metrics,</text>
  <text class="lbl nodeTitle" x="720" y="399" fill="#064E3B">segments, and provenance</text>

  <!-- boundary note -->
  <rect x="15" y="454" width="850" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text class="lbl noteText" x="440" y="477">Nine-step CR-3 training and evidence generation pipeline</text>
</svg>
