<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="100%" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Scale Benchmark Flow</title>
  <desc id="svgDesc">The requested scale ladder runs 100K, 500K, and 1M row training stages. Each stage records runtime, memory, and metrics, which are combined into the scale benchmark JSON and Markdown reports.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .lbl { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .zoneLabel { font-size:10px; font-weight:700; letter-spacing:1.4px; }
    .nodeTitle { font-size:13px; font-weight:600; text-anchor:middle; }
    .nodeSub { font-size:10.5px; opacity:0.85; text-anchor:middle; }
    .noteText { font-size:11.5px; fill:#475569; text-anchor:middle; }
  </style>
  <rect x="0" y="0" width="1120" height="440" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1120" height="56" rx="10" fill="#0F172A"/>
  <rect x="0" y="44" width="1120" height="12" fill="#0F172A"/>
  <text class="lbl" x="560" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#F1F5F9">Scale Benchmark Flow</text>

  <!-- zones -->
  <rect x="15" y="76" width="535" height="286" rx="6" fill="#EFF6FF"/>
  <text class="lbl zoneLabel" x="30" y="95" fill="#1D4ED8">REQUESTED SCALE RUNS</text>
  <rect x="560" y="166" width="545" height="106" rx="6" fill="#F0FDF4"/>
  <text class="lbl zoneLabel" x="575" y="185" fill="#15803D">MEASURED EVIDENCE OUTPUT</text>

  <!-- arrows -->
  <path d="M275,227 Q295,180 305,137" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <line x1="275" y1="227" x2="303" y2="227" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M275,227 Q295,274 305,317" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <path d="M545,137 Q565,180 575,227" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <line x1="545" y1="227" x2="573" y2="227" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M545,317 Q565,274 575,227" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ah)"/>
  <line x1="815" y1="227" x2="843" y2="227" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- nodes -->
  <rect x="35" y="196" width="240" height="62" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="155" y="222" fill="#1E3A8A">Requested scale ladder</text>
  <text class="lbl nodeSub" x="155" y="238" fill="#1E3A8A">100K / 500K / 1M prefixes</text>

  <rect x="305" y="106" width="240" height="62" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="425" y="132" fill="#7F1D1D">100K run</text>
  <text class="lbl nodeSub" x="425" y="148" fill="#7F1D1D">87,892 usable rows</text>

  <rect x="305" y="196" width="240" height="62" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="425" y="222" fill="#7F1D1D">500K run</text>
  <text class="lbl nodeSub" x="425" y="238" fill="#7F1D1D">391,168 usable rows</text>

  <rect x="305" y="286" width="240" height="62" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="425" y="312" fill="#7F1D1D">1M run</text>
  <text class="lbl nodeSub" x="425" y="328" fill="#7F1D1D">571,494 usable rows</text>

  <rect x="575" y="196" width="240" height="62" rx="8" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="695" y="222" fill="#064E3B">Runtime, memory, metrics</text>
  <text class="lbl nodeSub" x="695" y="238" fill="#064E3B">Peak RSS up to 3.24 GB</text>

  <rect x="845" y="196" width="240" height="62" rx="8" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="965" y="221" fill="#064E3B">Scale benchmark JSON</text>
  <text class="lbl nodeTitle" x="965" y="237" fill="#064E3B">and Markdown</text>

  <!-- boundary note -->
  <rect x="15" y="382" width="1090" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text class="lbl noteText" x="560" y="405">100K / 500K / 1M measured, full source not executed</text>
</svg>
