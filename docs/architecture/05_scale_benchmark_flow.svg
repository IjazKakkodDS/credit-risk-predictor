<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" width="100%" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Scale Benchmark Flow</title>
  <desc id="svgDesc">The requested scale ladder runs 100K, 500K, and 1M row training stages. Each stage records runtime, memory, and metrics, which are combined into the scale benchmark JSON and Markdown reports.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4338ca"/>
    </marker>
  </defs>
  <style>
    .bg { fill:#ffffff; }
    .titleBand { fill:#1e293b; }
    .titleText { font-family: Arial, Helvetica, sans-serif; font-size:19px; font-weight:bold; fill:#ffffff; text-anchor:middle; }
    .subtitleText { font-family: Arial, Helvetica, sans-serif; font-size:11.5px; fill:#cbd5e1; text-anchor:middle; }
    .zone { fill:#f8fafc; stroke:#e2e8f0; stroke-width:1.25; stroke-dasharray:4,3; }
    .zoneLabel { font-family: Arial, Helvetica, sans-serif; font-size:11px; font-weight:bold; fill:#475569; }
    .nodeProcess { fill:#ffffff; stroke:#4338ca; stroke-width:1.75; }
    .nodeArtifact { fill:#ffffff; stroke:#64748b; stroke-width:1.5; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:12.5px; fill:#1e293b; text-anchor:middle; }
    .edge { stroke:#4338ca; stroke-width:2; fill:none; marker-end:url(#arrow); }
  </style>
  <rect class="bg" x="0" y="0" width="1080" height="410"/>

  <rect class="titleBand" x="0" y="0" width="1080" height="70"/>
  <text class="titleText" x="540" y="32">Scale Benchmark Flow</text>
  <text class="subtitleText" x="540" y="54">100K / 500K / 1M measured, full source not executed</text>

  <!-- zones -->
  <rect class="zone" x="25" y="98" width="510" height="286" rx="8"/>
  <text class="zoneLabel" x="35" y="113">REQUESTED SCALE RUNS</text>
  <rect class="zone" x="545" y="188" width="510" height="106" rx="8"/>
  <text class="zoneLabel" x="555" y="203">MEASURED EVIDENCE OUTPUT</text>

  <!-- edges -->
  <line class="edge" x1="260" y1="250" x2="298" y2="160"/>
  <line class="edge" x1="260" y1="250" x2="298" y2="250"/>
  <line class="edge" x1="260" y1="250" x2="298" y2="340"/>
  <line class="edge" x1="520" y1="160" x2="558" y2="240"/>
  <line class="edge" x1="520" y1="250" x2="558" y2="250"/>
  <line class="edge" x1="520" y1="340" x2="558" y2="260"/>
  <line class="edge" x1="780" y1="250" x2="818" y2="250"/>

  <!-- nodes -->
  <rect class="nodeProcess" x="40" y="220" width="220" height="60" rx="10"/>
  <text class="label" x="150" y="255">Requested scale ladder</text>

  <rect class="nodeProcess" x="300" y="130" width="220" height="60" rx="10"/>
  <text class="label" x="410" y="165">100K run</text>

  <rect class="nodeProcess" x="300" y="220" width="220" height="60" rx="10"/>
  <text class="label" x="410" y="255">500K run</text>

  <rect class="nodeProcess" x="300" y="310" width="220" height="60" rx="10"/>
  <text class="label" x="410" y="345">1M run</text>

  <rect class="nodeArtifact" x="560" y="220" width="220" height="60" rx="10"/>
  <text class="label" x="670" y="244">Runtime, memory,</text>
  <text class="label" x="670" y="260">metrics</text>

  <rect class="nodeArtifact" x="820" y="220" width="220" height="60" rx="10"/>
  <text class="label" x="930" y="244">Scale benchmark JSON</text>
  <text class="label" x="930" y="260">and Markdown</text>
</svg>
