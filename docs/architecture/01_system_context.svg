<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="100%" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">System Context</title>
  <desc id="svgDesc">Data flow from loan application data through the feature availability policy, leakage-screened preprocessing, model training, probability calibration, and threshold analysis to validation and benchmark reports reviewed by an analyst or risk reviewer. Diagnostic and validation evidence system, not a deployed decision engine.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .lbl { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .zoneLabel { font-size:10px; font-weight:700; letter-spacing:1.4px; }
    .nodeTitle { font-size:13px; font-weight:600; text-anchor:middle; }
    .nodeSub { font-size:10.5px; opacity:0.85; text-anchor:middle; }
    .noteText { font-size:11.5px; fill:#475569; text-anchor:middle; }
  </style>
  <rect x="0" y="0" width="1120" height="390" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1120" height="56" rx="10" fill="#0F172A"/>
  <rect x="0" y="44" width="1120" height="12" fill="#0F172A"/>
  <text class="lbl" x="560" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#F1F5F9">System Context</text>

  <!-- zones -->
  <rect x="15" y="76" width="1090" height="106" rx="6" fill="#EFF6FF"/>
  <text class="lbl zoneLabel" x="30" y="95" fill="#1D4ED8">DATA INTAKE &amp; FEATURE POLICY</text>
  <rect x="15" y="202" width="1090" height="106" rx="6" fill="#F5F3FF"/>
  <text class="lbl zoneLabel" x="30" y="221" fill="#6D28D9">MODEL FIT, CALIBRATION &amp; EVIDENCE</text>

  <!-- arrows -->
  <line x1="275" y1="137" x2="303" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="545" y1="137" x2="573" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="815" y1="137" x2="843" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="965" y1="168" x2="965" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="845" y1="263" x2="817" y2="263" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="575" y1="263" x2="547" y2="263" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="305" y1="263" x2="277" y2="263" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- row 1 nodes -->
  <rect x="35" y="106" width="240" height="62" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="155" y="132" fill="#1E3A8A">Loan application data</text>
  <text class="lbl nodeSub" x="155" y="148" fill="#1E3A8A">Local ignored CSV source</text>

  <rect x="305" y="106" width="240" height="62" rx="8" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="425" y="132" fill="#3B0764">Feature availability policy</text>
  <text class="lbl nodeSub" x="425" y="148" fill="#3B0764">27 leakage-screened inputs</text>

  <rect x="575" y="106" width="240" height="62" rx="8" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="695" y="131" fill="#3B0764">Leakage-screened</text>
  <text class="lbl nodeTitle" x="695" y="147" fill="#3B0764">preprocessing</text>

  <rect x="845" y="106" width="240" height="62" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="965" y="132" fill="#7F1D1D">Model training</text>
  <text class="lbl nodeSub" x="965" y="148" fill="#7F1D1D">Balanced logistic regression</text>

  <!-- row 2 nodes -->
  <rect x="845" y="232" width="240" height="62" rx="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="965" y="258" fill="#7C2D12">Probability calibration</text>
  <text class="lbl nodeSub" x="965" y="274" fill="#7C2D12">Platt sigmoid</text>

  <rect x="575" y="232" width="240" height="62" rx="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="695" y="258" fill="#7C2D12">Threshold analysis</text>
  <text class="lbl nodeSub" x="695" y="274" fill="#7C2D12">Calibration-split F1</text>

  <rect x="305" y="232" width="240" height="62" rx="8" fill="#BBF7D0" stroke="#059669" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="425" y="257" fill="#064E3B">Validation and</text>
  <text class="lbl nodeTitle" x="425" y="273" fill="#064E3B">benchmark reports</text>

  <rect x="35" y="232" width="240" height="62" rx="8" fill="#FBCFE8" stroke="#DB2777" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="155" y="258" fill="#831843">Analyst or risk reviewer</text>
  <text class="lbl nodeSub" x="155" y="274" fill="#831843">Human decision authority</text>

  <!-- boundary note -->
  <rect x="15" y="328" width="1090" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text class="lbl noteText" x="560" y="351">Diagnostic evidence system, not a deployed decision engine</text>
</svg>
