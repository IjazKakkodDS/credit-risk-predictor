<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" width="100%" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">System Context</title>
  <desc id="svgDesc">Data flow from loan application data through the feature availability policy, leakage-screened preprocessing, model training, probability calibration, and threshold analysis to validation and benchmark reports reviewed by an analyst or risk reviewer. Diagnostic and validation evidence system, not a deployed decision engine.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4338ca"/>
    </marker>
  </defs>
  <style>
    .bg { fill:#ffffff; }
    .titleBand { fill:#1e293b; }
    .titleText { font-family: Arial, Helvetica, sans-serif; font-size:19px; font-weight:bold; fill:#ffffff; text-anchor:middle; }
    .subtitleText { font-family: Arial, Helvetica, sans-serif; font-size:11.5px; fill:#cbd5e1; text-anchor:middle; }
    .zone { fill:#f8fafc; stroke:#e2e8f0; stroke-width:1.25; stroke-dasharray:4,3; }
    .zoneLabel { font-family: Arial, Helvetica, sans-serif; font-size:11px; font-weight:bold; fill:#475569; }
    .nodeProcess { fill:#ffffff; stroke:#4338ca; stroke-width:1.75; }
    .nodeArtifact { fill:#ffffff; stroke:#64748b; stroke-width:1.5; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:12.5px; fill:#1e293b; text-anchor:middle; }
    .edge { stroke:#4338ca; stroke-width:2; fill:none; marker-end:url(#arrow); }
  </style>
  <rect class="bg" x="0" y="0" width="1080" height="390"/>

  <rect class="titleBand" x="0" y="0" width="1080" height="70"/>
  <text class="titleText" x="540" y="32">System Context</text>
  <text class="subtitleText" x="540" y="54">Diagnostic evidence system, not a deployed decision engine</text>

  <!-- zones -->
  <rect class="zone" x="25" y="98" width="1030" height="106" rx="8"/>
  <text class="zoneLabel" x="35" y="113">DATA INTAKE &amp; MODELING</text>
  <rect class="zone" x="25" y="258" width="1030" height="106" rx="8"/>
  <text class="zoneLabel" x="35" y="273">CALIBRATION, ANALYSIS &amp; EVIDENCE OUTPUT</text>

  <!-- edges -->
  <line class="edge" x1="260" y1="160" x2="298" y2="160"/>
  <line class="edge" x1="520" y1="160" x2="558" y2="160"/>
  <line class="edge" x1="780" y1="160" x2="818" y2="160"/>
  <line class="edge" x1="930" y1="190" x2="930" y2="288"/>
  <line class="edge" x1="818" y1="320" x2="782" y2="320"/>
  <line class="edge" x1="558" y1="320" x2="522" y2="320"/>
  <line class="edge" x1="298" y1="320" x2="262" y2="320"/>

  <!-- nodes -->
  <rect class="nodeProcess" x="40" y="130" width="220" height="60" rx="10"/>
  <text class="label" x="150" y="165">Loan application data</text>

  <rect class="nodeProcess" x="300" y="130" width="220" height="60" rx="10"/>
  <text class="label" x="410" y="154">Feature availability</text>
  <text class="label" x="410" y="170">policy</text>

  <rect class="nodeProcess" x="560" y="130" width="220" height="60" rx="10"/>
  <text class="label" x="670" y="154">Leakage-screened</text>
  <text class="label" x="670" y="170">preprocessing</text>

  <rect class="nodeProcess" x="820" y="130" width="220" height="60" rx="10"/>
  <text class="label" x="930" y="165">Model training</text>

  <rect class="nodeProcess" x="820" y="290" width="220" height="60" rx="10"/>
  <text class="label" x="930" y="325">Probability calibration</text>

  <rect class="nodeProcess" x="560" y="290" width="220" height="60" rx="10"/>
  <text class="label" x="670" y="325">Threshold analysis</text>

  <rect class="nodeArtifact" x="300" y="290" width="220" height="60" rx="10"/>
  <text class="label" x="410" y="314">Validation and</text>
  <text class="label" x="410" y="330">benchmark reports</text>

  <rect class="nodeArtifact" x="40" y="290" width="220" height="60" rx="10"/>
  <text class="label" x="150" y="325">Analyst or risk reviewer</text>
</svg>
