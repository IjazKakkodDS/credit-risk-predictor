<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 288" width="100%" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Temporal Split Design</title>
  <desc id="svgDesc">Rows are sorted by issue_d, then allocated to the earlier 60 percent as training, the middle 20 percent as calibration and threshold selection, and the latest 20 percent as the untouched final test.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .lbl { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .zoneLabel { font-size:10px; font-weight:700; letter-spacing:1.4px; }
    .nodeTitle { font-size:13px; font-weight:600; text-anchor:middle; }
    .nodeSub { font-size:10.5px; opacity:0.85; text-anchor:middle; }
    .noteText { font-size:11.5px; fill:#475569; text-anchor:middle; }
  </style>
  <rect x="0" y="0" width="1280" height="288" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1280" height="56" rx="10" fill="#0F172A"/>
  <rect x="0" y="44" width="1280" height="12" fill="#0F172A"/>
  <text class="lbl" x="640" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#F1F5F9">Temporal Split Design</text>

  <!-- zone -->
  <rect x="15" y="76" width="1250" height="134" rx="6" fill="#F1F5F9"/>
  <text class="lbl zoneLabel" x="30" y="95" fill="#475569">ORDERED TEMPORAL PARTITIONS (ISSUE_D)</text>

  <!-- arrows -->
  <line x1="315" y1="151" x2="343" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="625" y1="151" x2="653" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="935" y1="151" x2="963" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- nodes -->
  <rect x="35" y="106" width="280" height="90" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="175" y="146" fill="#1E3A8A">Rows sorted by issue_d</text>
  <text class="lbl nodeSub" x="175" y="162" fill="#1E3A8A">Deterministic ordering</text>

  <rect x="345" y="106" width="280" height="90" rx="8" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="485" y="146" fill="#3B0764">Earlier 60 percent: training</text>
  <text class="lbl nodeSub" x="485" y="162" fill="#3B0764">52,735 rows (100K canonical)</text>

  <rect x="655" y="106" width="280" height="90" rx="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="795" y="133" fill="#7C2D12">Middle 20 percent:</text>
  <text class="lbl nodeTitle" x="795" y="151" fill="#7C2D12">calibration and</text>
  <text class="lbl nodeTitle" x="795" y="169" fill="#7C2D12">threshold selection</text>

  <rect x="965" y="106" width="280" height="90" rx="8" fill="#CFFAFE" stroke="#0E7490" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="1105" y="145" fill="#164E63">Latest 20 percent:</text>
  <text class="lbl nodeTitle" x="1105" y="161" fill="#164E63">untouched final test</text>

  <!-- boundary note -->
  <rect x="15" y="230" width="1250" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text class="lbl noteText" x="640" y="253">Narrow 3-month window, ordered validation, not multi-vintage</text>
</svg>
