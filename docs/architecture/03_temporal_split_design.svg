<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 270" width="100%" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Temporal Split Design</title>
  <desc id="svgDesc">Rows are sorted by issue_d, then allocated to the earlier 60 percent as training, the middle 20 percent as calibration and threshold selection, and the latest 20 percent as the untouched final test.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4338ca"/>
    </marker>
  </defs>
  <style>
    .bg { fill:#ffffff; }
    .titleBand { fill:#1e293b; }
    .titleText { font-family: Arial, Helvetica, sans-serif; font-size:19px; font-weight:bold; fill:#ffffff; text-anchor:middle; }
    .subtitleText { font-family: Arial, Helvetica, sans-serif; font-size:11.5px; fill:#cbd5e1; text-anchor:middle; }
    .zone { fill:#f8fafc; stroke:#e2e8f0; stroke-width:1.25; stroke-dasharray:4,3; }
    .zoneLabel { font-family: Arial, Helvetica, sans-serif; font-size:11px; font-weight:bold; fill:#475569; }
    .nodeProcess { fill:#ffffff; stroke:#4338ca; stroke-width:1.75; }
    .nodeProtected { fill:#eef2ff; stroke:#4338ca; stroke-width:1.75; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:12.5px; fill:#1e293b; text-anchor:middle; }
    .edge { stroke:#4338ca; stroke-width:2; fill:none; marker-end:url(#arrow); }
  </style>
  <rect class="bg" x="0" y="0" width="1240" height="270"/>

  <rect class="titleBand" x="0" y="0" width="1240" height="70"/>
  <text class="titleText" x="620" y="32">Temporal Split Design</text>
  <text class="subtitleText" x="620" y="54">Narrow 3-month window, ordered validation, not multi-vintage</text>

  <!-- zone -->
  <rect class="zone" x="25" y="118" width="1190" height="126" rx="8"/>
  <text class="zoneLabel" x="35" y="133">ORDERED TEMPORAL PARTITIONS (ISSUE_D)</text>

  <!-- edges -->
  <line class="edge" x1="300" y1="190" x2="338" y2="190"/>
  <line class="edge" x1="600" y1="190" x2="638" y2="190"/>
  <line class="edge" x1="900" y1="190" x2="938" y2="190"/>

  <!-- nodes -->
  <rect class="nodeProcess" x="40" y="150" width="260" height="80" rx="10"/>
  <text class="label" x="170" y="195">Rows sorted by issue_d</text>

  <rect class="nodeProcess" x="340" y="150" width="260" height="80" rx="10"/>
  <text class="label" x="470" y="184">Earlier 60 percent:</text>
  <text class="label" x="470" y="200">training</text>

  <rect class="nodeProcess" x="640" y="150" width="260" height="80" rx="10"/>
  <text class="label" x="770" y="174">Middle 20 percent:</text>
  <text class="label" x="770" y="190">calibration and</text>
  <text class="label" x="770" y="206">threshold selection</text>

  <rect class="nodeProtected" x="940" y="150" width="260" height="80" rx="10"/>
  <text class="label" x="1070" y="184">Latest 20 percent:</text>
  <text class="label" x="1070" y="200">untouched final test</text>
</svg>
