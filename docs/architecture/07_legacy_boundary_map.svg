<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="100%" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Legacy Boundary Map</title>
  <desc id="svgDesc">Distinguishes the active, canonical CR-3 evidence path (scripts/train_credit_risk_model.py, sklearn preprocessing, balanced logistic regression, Platt calibration, calibration-only threshold selection, untouched test evaluation, and the generated reports and artifacts) from retained legacy scaffolding (src/components/model_trainer.py, the Optuna helper in src/utils.py, src/pipeline/predict_pipeline.py, static/, and unused legacy requirements such as xgboost, catboost, optuna, Flask, and gunicorn) that is disclosed in the README as not the source of committed CR-3 evidence. Neither path represents a deployed or production-serving system.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .lbl { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .zoneLabel { font-size:10px; font-weight:700; letter-spacing:1.4px; }
    .nodeTitle { font-size:12.5px; font-weight:600; text-anchor:middle; }
    .noteText { font-size:11.5px; fill:#475569; text-anchor:middle; }
    .dividerLabel { font-size:11px; fill:#64748B; text-anchor:middle; }
    .chip { font-size:10px; font-weight:700; text-anchor:middle; }
  </style>
  <rect x="0" y="0" width="900" height="744" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="900" height="56" rx="10" fill="#0F172A"/>
  <rect x="0" y="44" width="900" height="12" fill="#0F172A"/>
  <text class="lbl" x="450" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#F1F5F9">Legacy Boundary Map</text>

  <!-- zones -->
  <rect x="25" y="76" width="340" height="590" rx="6" fill="#EEF2FF"/>
  <text class="lbl zoneLabel" x="40" y="95" fill="#4338CA">ACTIVE CR-3 EVIDENCE PATH</text>
  <rect x="248" y="86" width="102" height="18" rx="9" fill="#059669"/>
  <text class="lbl chip" x="299" y="99" fill="#FFFFFF">8 STEPS</text>

  <rect x="535" y="76" width="340" height="590" rx="6" fill="#F1F5F9"/>
  <text class="lbl zoneLabel" x="550" y="95" fill="#475569">LEGACY SCAFFOLDING</text>
  <rect x="795" y="86" width="65" height="18" rx="9" fill="#9CA3AF"/>
  <text class="lbl chip" x="827" y="99" fill="#FFFFFF">5 ITEMS</text>

  <!-- divider -->
  <line x1="450" y1="76" x2="450" y2="666" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,5"/>
  <rect x="380" y="355" width="140" height="32" fill="#F8FAFC"/>
  <text class="lbl dividerLabel" x="450" y="368">No evidence link</text>
  <text class="lbl dividerLabel" x="450" y="383">between paths</text>

  <!-- lane 1: active CR-3 evidence path (sequential chain) -->
  <line x1="195" y1="162" x2="195" y2="174" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="195" y1="232" x2="195" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="195" y1="302" x2="195" y2="314" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="195" y1="372" x2="195" y2="384" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="195" y1="442" x2="195" y2="454" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="195" y1="512" x2="195" y2="524" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="195" y1="582" x2="195" y2="594" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="40" y="106" width="310" height="56" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="195" y="138" fill="#1E293B">scripts/train_credit_risk_model.py</text>

  <rect x="40" y="176" width="310" height="56" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="195" y="208" fill="#1E293B">sklearn preprocessing</text>

  <rect x="40" y="246" width="310" height="56" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="195" y="278" fill="#1E293B">balanced LogisticRegression</text>

  <rect x="40" y="316" width="310" height="56" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="195" y="348" fill="#1E293B">Platt calibration</text>

  <rect x="40" y="386" width="310" height="56" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="195" y="418" fill="#1E293B">calibration-only threshold selection</text>

  <rect x="40" y="456" width="310" height="56" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="195" y="488" fill="#1E293B">untouched test evaluation</text>

  <rect x="40" y="526" width="310" height="56" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="195" y="558" fill="#1E293B">reports/model_validation/</text>

  <rect x="40" y="596" width="310" height="56" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="195" y="618" fill="#1E293B">artifact/model.pkl and</text>
  <text class="lbl nodeTitle" x="195" y="634" fill="#1E293B">artifact/preprocessor.pkl</text>

  <!-- lane 2: legacy scaffolding (disclosed set, no flow arrows) -->
  <rect x="550" y="106" width="310" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="lbl nodeTitle" x="705" y="145" fill="#4B5563">src/components/model_trainer.py</text>

  <rect x="550" y="225" width="310" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="lbl nodeTitle" x="705" y="264" fill="#4B5563">src/utils.py Optuna helper</text>

  <rect x="550" y="344" width="310" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="lbl nodeTitle" x="705" y="383" fill="#4B5563">src/pipeline/predict_pipeline.py</text>

  <rect x="550" y="463" width="310" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="lbl nodeTitle" x="705" y="502" fill="#4B5563">static/</text>

  <rect x="550" y="582" width="310" height="70" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text class="lbl nodeTitle" x="705" y="605" fill="#4B5563">Legacy requirements entries:</text>
  <text class="lbl nodeTitle" x="705" y="621" fill="#4B5563">xgboost, catboost, optuna,</text>
  <text class="lbl nodeTitle" x="705" y="637" fill="#4B5563">Flask, gunicorn</text>

  <!-- boundary note -->
  <rect x="25" y="686" width="850" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text class="lbl noteText" x="450" y="709">No evidence link to legacy scaffolding, neither path is deployed</text>
</svg>
