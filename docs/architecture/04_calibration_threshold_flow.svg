<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="100%" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Calibration and Threshold Flow</title>
  <desc id="svgDesc">From the training split, a balanced logistic regression produces calibration probabilities, which Platt sigmoid calibration converts into a calibration threshold grid. The best analytical F1 threshold is selected on the calibration split, then evaluated once on the untouched test split.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#475569"/>
    </marker>
  </defs>
  <style>
    .lbl { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .zoneLabel { font-size:10px; font-weight:700; letter-spacing:1.4px; }
    .nodeTitle { font-size:13px; font-weight:600; text-anchor:middle; }
    .nodeSub { font-size:10.5px; opacity:0.85; text-anchor:middle; }
    .noteText { font-size:11.5px; fill:#475569; text-anchor:middle; }
  </style>
  <rect x="0" y="0" width="1120" height="390" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="0" y="0" width="1120" height="56" rx="10" fill="#0F172A"/>
  <rect x="0" y="44" width="1120" height="12" fill="#0F172A"/>
  <text class="lbl" x="560" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#F1F5F9">Calibration and Threshold Flow</text>

  <!-- zones -->
  <rect x="15" y="76" width="1090" height="106" rx="6" fill="#FFF1F2"/>
  <text class="lbl zoneLabel" x="30" y="95" fill="#BE123C">TRAINING &amp; CALIBRATION</text>
  <rect x="15" y="202" width="1090" height="106" rx="6" fill="#FFFBEB"/>
  <text class="lbl zoneLabel" x="30" y="221" fill="#B45309">THRESHOLD SELECTION &amp; TEST</text>

  <!-- arrows -->
  <line x1="275" y1="137" x2="303" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="545" y1="137" x2="573" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="815" y1="137" x2="843" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="965" y1="168" x2="965" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="845" y1="263" x2="817" y2="263" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="575" y1="263" x2="547" y2="263" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>

  <!-- row 1 -->
  <rect x="35" y="106" width="240" height="62" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="155" y="132" fill="#7F1D1D">Training split</text>
  <text class="lbl nodeSub" x="155" y="148" fill="#7F1D1D">52,735 rows (canonical 100K)</text>

  <rect x="305" y="106" width="240" height="62" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="425" y="131" fill="#7F1D1D">Balanced logistic</text>
  <text class="lbl nodeTitle" x="425" y="147" fill="#7F1D1D">regression</text>

  <rect x="575" y="106" width="240" height="62" rx="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="695" y="132" fill="#7C2D12">Calibration probabilities</text>
  <text class="lbl nodeSub" x="695" y="148" fill="#7C2D12">Uncalibrated Brier 0.2096</text>

  <rect x="845" y="106" width="240" height="62" rx="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="965" y="132" fill="#7C2D12">Platt sigmoid calibration</text>
  <text class="lbl nodeSub" x="965" y="148" fill="#7C2D12">Calibrated Brier 0.1470</text>

  <!-- row 2 -->
  <rect x="845" y="232" width="240" height="62" rx="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="965" y="258" fill="#7C2D12">Calibration threshold grid</text>
  <text class="lbl nodeSub" x="965" y="274" fill="#7C2D12">F1-maximizing search</text>

  <rect x="575" y="232" width="240" height="62" rx="8" fill="#FED7AA" stroke="#EA580C" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="695" y="257" fill="#7C2D12">Select best analytical</text>
  <text class="lbl nodeTitle" x="695" y="273" fill="#7C2D12">F1 threshold</text>

  <rect x="305" y="232" width="240" height="62" rx="8" fill="#CFFAFE" stroke="#0E7490" stroke-width="1.5"/>
  <text class="lbl nodeTitle" x="425" y="257" fill="#164E63">One-time untouched-test</text>
  <text class="lbl nodeTitle" x="425" y="273" fill="#164E63">evaluation</text>

  <!-- boundary note -->
  <rect x="15" y="328" width="1090" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text class="lbl noteText" x="560" y="351">Analytical threshold, not an approved operating policy</text>
</svg>
